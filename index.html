<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Örnek Form</title>
</head>
<body>

    <form>
        Numara: <input type="number" name="numara"><br>
        Adiniz: <input type="text" name="ad"><br>
        Bölüm: 
        <select name="bolum">
            <option value="Bilgisayar Muhendisligi">Bilgisayar Mühendisliği</option>
            <option value="Elektronik Muhendisligi">Elektronik Mühendisliği</option>
            <option value="Makine Muhendisligi">Makine Mühendisliği</option>
            <option value="Endustri Muhendisligi">Endüstri Mühendisliği</option>
        </select><br>
        
        Dersler:<br>
        <input type="checkbox" name="d1" value="1"> Matematik <br>
        <input type="checkbox" name="d2" value="2"> Türk Dili <br>
        <input type="checkbox" name="d3" value="3"> Yabancı Dil <br>
        <input type="checkbox" name="d4" value="4"> Programlama <br>
        <input type="checkbox" name="d5" value="5"> Web Tasarım <br>

        <input type="submit" value="GÖNDER" />
        <input type="reset" value="TEMİZLE" />
    </form>

</body>
</html>
